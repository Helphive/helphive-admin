name: Deploy to Firebase Hosting on PR
on: pull_request
permissions:
    checks: write
    contents: read
    pull-requests: write
jobs:
    build_and_preview:
        if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version-file: ".nvmrc"
                  cache: npm

            - run: npm ci

            # Only public build settings; see firebase-hosting-merge.yml.
            - name: Create .env file
              run: |
                  echo "VITE_APP_API_URL=${{ vars.VITE_APP_API_URL }}" >> .env
                  echo "VITE_APP_BUILD=${{ github.event.pull_request.head.sha }}" >> .env

            - run: npm run build

            - uses: FirebaseExtended/action-hosting-deploy@v0
              with:
                  repoToken: ${{ secrets.GITHUB_TOKEN }}
                  firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_HELPHIVE }}
                  projectId: helphive
                  target: helphive
