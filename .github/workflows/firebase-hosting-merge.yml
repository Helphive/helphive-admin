name: Deploy to Firebase Hosting on merge
on:
    push:
        branches:
            - main
jobs:
    build_and_deploy:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version-file: ".nvmrc"
                  cache: npm

            - run: npm ci

            # The console reads only these at build time. Never put a secret here: everything in a
            # VITE_ variable ends up in the JavaScript that every visitor downloads.
            - name: Create .env file
              run: |
                  echo "VITE_APP_API_URL=${{ vars.VITE_APP_API_URL }}" >> .env
                  echo "VITE_APP_BUILD=${{ github.sha }}" >> .env

            - run: npm run build

            - uses: FirebaseExtended/action-hosting-deploy@v0
              with:
                  repoToken: ${{ secrets.GITHUB_TOKEN }}
                  firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_HELPHIVE }}
                  channelId: live
                  projectId: helphive
                  target: helphive
